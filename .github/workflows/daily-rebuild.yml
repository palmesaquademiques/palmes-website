name: Daily rebuild

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger the Vercel deploy hook
        run: curl --fail --silent --show-error --request POST "$VERCEL_DEPLOY_HOOK"
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
